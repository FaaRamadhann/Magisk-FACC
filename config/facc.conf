# FACC config — disalin ke /data/adb/facc/facc.conf saat install.
# Edit file di /data/adb/facc/facc.conf (bukan di sini) agar tidak hilang saat update.

# 1 = auto-clean aktif, 0 = mati
AUTO_CLEAN=1

# Jeda antar pembersihan otomatis (menit)
INTERVAL_MINUTES=30

# Batas log sebelum rotasi (KB) & jumlah arsip
MAX_LOG_SIZE_KB=512
MAX_ARCHIVE=7
